server {
    listen 80;
    server_name pmbm.mtsn1kotamalang.sch.id;

    root /var/www/ppdbm/public; # Sesuaikan dengan path ke direktori webmu
# root /var/www;   

 index index.php index.html index.htm;
	client_max_body_size 30M;
	#logging


	#tambahan
	location ~* \.(css|js|jpg|jpeg|png|svg|ico|woff2|woff|ttf)$ {
		root /var/www/ppdbm/public;
		try_files $uri =404;
		expires 30d;
		access_log off;
		client_max_body_size 30M;

	}

	#location /storage {
    	#	try_files $uri $uri/ =404;
	#}



location /storage {
    alias /var/www/laravel/storage/app/public;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}    

# Menangani permintaan untuk file PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;  # Pastikan PHP 8.3 FPM sudah berjalan
        #fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #include fastcgi_params;
        include fastcgi_params;
	#tambahan
	fastcgi_buffers 16 16k;
	fastcgi_buffer_size 32k;
    }

    # Menangani permintaan untuk file statis (CSS, JS, gambar, dll.)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

	#tambahan
	location ~ /\. {
		deny all;
	}

    # Log error dan access
    error_log /var/log/nginx/pmbm.mtsn1kotamalang.sch.id.error.log;
    access_log /var/log/nginx/pmbm.mtsn1kotamalang.sch.id.access.log;

}

# Redirect ke HTTPS (opsional)
server {
   listen 443 ssl;
    server_name pmbm.mtsn1kotamalang.sch.id;

    ssl_certificate /etc/ssl/mtsn.crt;   # Sesuaikan dengan path SSL Certificate
    ssl_certificate_key /etc/ssl/mtsn.key; # Sesuaikan dengan path Private Key

    root /var/www/ppdbm/public; # Sesuaikan dengan path ke direktori webmu
 # root /var/www;    
index index.php index.html index.htm;
	client_max_body_size 30M;

	location ~* \.(css|js|jpg|jpeg|png|svg|ico|woff2|woff|ttf)$ {
		root /var/www/ppdbm/public;
		try_files $uri =404;
		expires 30d;
		access_log off;
		client_max_body_size 30M;
		add_header Cache-Control "public";
	}

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
	#tambahan
	fastcgi_buffers 16 16k;
	fastcgi_buffer_size 32k;
    }

	#location /storage {
    	#	try_files $uri $uri/ =404;
	#}


location /storage {
